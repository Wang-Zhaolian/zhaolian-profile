$schema: https://json-schema.org/draft/2020-12/schema
title: Publication Records
type: object
required: [version, records]
properties:
  version: {const: 1}
  records:
    type: array
    items:
      type: object
      required: [id, title, authors, my_author_position, year, status, cv_eligible, priority, tags]
      properties:
        id: {type: string, pattern: '^paper_[0-9]{3,}$'}
        title: {type: string, minLength: 1}
        title_en: {type: string, minLength: 1}
        title_zh: {type: string, minLength: 1}
        authors: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        my_author_position: {type: [integer, string]}
        venue: {type: string}
        year: {type: integer, minimum: 1900, maximum: 2200}
        status: {enum: [published, accepted, under_review, submitted, preprint, manuscript]}
        doi: {type: string}
        url: {type: string}
        arxiv: {type: string}
        research_id: {type: [string, "null"]}
        citation: {type: string}
        notes: {type: string}
        cv_bullets: {type: array, items: {type: string}}
        cv_eligible: {type: boolean}
        record_state: {enum: [draft, ready]}
        priority: {type: integer, minimum: 1, maximum: 5}
        tags: {type: array, items: {type: string}}
        include_for: {type: object, additionalProperties: {type: boolean}}
        archived: {type: boolean}
      additionalProperties: true
additionalProperties: false
