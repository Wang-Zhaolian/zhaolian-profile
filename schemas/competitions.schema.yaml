$schema: https://json-schema.org/draft/2020-12/schema
title: Competition Records
type: object
required: [version, records]
properties:
  version: {const: 1}
  records:
    type: array
    items:
      type: object
      required: [id, name, level, organizer, date, result, cv_eligible, priority, tags]
      properties:
        id: {type: string, pattern: '^competition_[0-9]{3,}$'}
        name: {type: string, minLength: 1}
        level: {type: string, minLength: 1}
        organizer: {type: string, minLength: 1}
        date: {type: string}
        result: {type: string, minLength: 1}
        team: {type: [boolean, string]}
        role: {type: string}
        description: {type: string}
        project_id: {type: [string, "null"]}
        evidence: {type: array, items: {type: string}}
        cv_bullets: {type: array, items: {type: string}}
        cv_eligible: {type: boolean}
        record_state: {enum: [draft, ready]}
        priority: {type: integer, minimum: 1, maximum: 5}
        tags: {type: array, items: {type: string}}
        include_for: {type: object, additionalProperties: {type: boolean}}
        archived: {type: boolean}
      additionalProperties: true
additionalProperties: false
