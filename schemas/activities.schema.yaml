$schema: https://json-schema.org/draft/2020-12/schema
title: Activity Records
type: object
required: [version, records]
properties:
  version: {const: 1}
  records:
    type: array
    items:
      type: object
      required: [id, name, organization, role, start_date, status, cv_eligible, priority, tags]
      properties:
        id: {type: string, pattern: '^activity_[0-9]{3,}$'}
        name: {type: string, minLength: 1}
        organization: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        start_date: {type: string}
        end_date: {type: string}
        status: {enum: [planned, active, completed, archived]}
        description: {type: string}
        cv_bullets: {type: array, items: {type: string}}
        cv_eligible: {type: boolean}
        record_state: {enum: [draft, ready]}
        priority: {type: integer, minimum: 1, maximum: 5}
        tags: {type: array, items: {type: string}}
        include_for: {type: object, additionalProperties: {type: boolean}}
        archived: {type: boolean}
      additionalProperties: true
additionalProperties: false
