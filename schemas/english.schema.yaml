$schema: https://json-schema.org/draft/2020-12/schema
title: English Test Records
type: object
required: [version, records]
properties:
  version: {const: 1}
  records:
    type: array
    items:
      type: object
      required: [id, test, score, date, cv_eligible, priority, tags]
      properties:
        id: {type: string, pattern: '^english_[0-9]{3,}$'}
        test: {type: string, minLength: 1}
        score: {type: [number, string]}
        subscores: {type: object, additionalProperties: {type: [number, string]}}
        date: {type: string}
        evidence: {type: array, items: {type: string}}
        cv_eligible: {type: boolean}
        record_state: {enum: [draft, ready]}
        priority: {type: integer, minimum: 1, maximum: 5}
        tags: {type: array, items: {type: string}}
        include_for: {type: object, additionalProperties: {type: boolean}}
        archived: {type: boolean}
      additionalProperties: true
additionalProperties: false
