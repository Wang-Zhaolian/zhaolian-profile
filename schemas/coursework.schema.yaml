$schema: https://json-schema.org/draft/2020-12/schema
title: Coursework Records
type: object
required: [version, records]
properties:
  version: {const: 1}
  records:
    type: array
    items:
      type: object
      required: [id, course_name, institution, semester, category, level, transcript_visible, cv_eligible, priority, tags]
      properties:
        id: {type: string, pattern: '^course_[0-9]{3,}$'}
        course_name: {type: string, minLength: 1}
        institution: {type: string, minLength: 1}
        semester: {type: string, minLength: 1}
        credits: {type: [number, string]}
        grade: {type: [number, string]}
        rank_if_known: {type: [string, "null"]}
        category: {type: string, minLength: 1}
        level: {enum: [introductory, intermediate, advanced, graduate]}
        topics: {type: array, items: {type: string}}
        skill_ids: {type: array, items: {type: string}}
        transcript_visible: {type: boolean}
        cv_eligible: {type: boolean}
        record_state: {enum: [draft, ready]}
        priority: {type: integer, minimum: 1, maximum: 5}
        tags: {type: array, items: {type: string}}
        include_for: {type: object, additionalProperties: {type: boolean}}
        notes: {type: string}
        archived: {type: boolean}
      additionalProperties: true
additionalProperties: false
